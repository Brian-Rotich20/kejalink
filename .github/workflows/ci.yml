name: backend-ci

on:
  push:
    branches: [main, "feat/**"]
    paths: ["backend/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kejalink_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI values only; nothing here is a real secret.
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/kejalink_test
      DATABASE_URL: postgresql://postgres:test@localhost:5432/kejalink_test
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      BETTER_AUTH_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:3000
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Migrate
        run: npm run db:migrate
      - name: Schema drift check
        run: npx drizzle-kit check
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
